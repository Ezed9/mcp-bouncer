name: Release

# Tag-driven. `bouncer-core` and `bouncer-mcp` are versioned and released
# together from this workspace; both are uploaded under PyPI Trusted Publishing
# (OIDC), so no long-lived API token exists in this repository's secrets.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true

      # Checked before the build, so a mistyped tag costs seconds rather than a
      # failed upload. --frozen keeps this a pure read: no re-lock, no sync.
      - name: The tag must match the version being published
        run: |
          tag="${GITHUB_REF_NAME#v}"
          for pkg in bouncer-core bouncer-mcp; do
            version=$(uv version --package "$pkg" --short --frozen)
            if [ "$tag" != "$version" ]; then
              echo "::error::tag $GITHUB_REF_NAME does not match $pkg $version"
              exit 1
            fi
          done

      # Built into separate directories: a trusted-publishing token is minted
      # per project, so each distribution is uploaded by its own step.
      - name: Build both distributions
        run: |
          uv build --package bouncer-core --out-dir dist/core
          uv build --package bouncer-mcp  --out-dir dist/mcp
          ls -la dist/core dist/mcp

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distributions
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write          # mints the OIDC token; nothing else is needed
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distributions
          path: dist/

      - name: Publish bouncer-core
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/core

      - name: Publish bouncer-mcp
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/mcp
