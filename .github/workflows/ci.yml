name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Upstream releases break installs without a commit here (mcp 2.0 did), so the
  # fresh-resolution job also runs on a clock.
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # No job pushes; a persisted token in .git/config is only exposure.
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-packages --python ${{ matrix.python-version }}

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Test (pytest)
        run: uv run pytest -q

      - name: No-key benchmark path imports & scorer test
        run: uv run python -m benchmark.run_agentdojo

      # The split exists so a consumer of the engine alone never installs the
      # MCP SDK -- and through it uvicorn, starlette, pydantic and pyjwt. That
      # is a property of the dependency graph, so assert it against a real
      # install rather than trusting the pyproject to stay honest.
      - name: bouncer-core must not pull the MCP tree
        run: |
          uv venv /tmp/core-only --python ${{ matrix.python-version }}
          VIRTUAL_ENV=/tmp/core-only uv pip install .
          VIRTUAL_ENV=/tmp/core-only uv pip list > /tmp/core-only.txt
          cat /tmp/core-only.txt
          if grep -qiE '^(mcp|anyio|uvicorn|starlette|pydantic|pyjwt|mcp-types)[[:space:]]' /tmp/core-only.txt; then
            echo "::error::bouncer-core has regained a dependency the split removed"
            exit 1
          fi

  # The lockfile pinned mcp 1.28.1, so CI stayed green while every fresh install
  # of 0.1.1 resolved mcp 2.x and crashed. This job installs with no lockfile,
  # exactly as `pip install bouncer-mcp` resolves today, and runs the suite on it.
  fresh-resolution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # No job pushes; a persisted token in .git/config is only exposure.
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Install both packages with no lockfile
        run: |
          uv venv "$RUNNER_TEMP/fresh" --python 3.13
          VIRTUAL_ENV="$RUNNER_TEMP/fresh" uv pip install --no-cache . ./bouncer-mcp pytest pytest-asyncio
          VIRTUAL_ENV="$RUNNER_TEMP/fresh" uv pip list

      - name: Test against the fresh install
        run: '"$RUNNER_TEMP/fresh/bin/python" -m pytest -q'
