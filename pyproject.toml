[project]
name = "bouncer-core"
version = "0.1.6"
description = "Deterministic contract enforcement for agent tool calls: gates the destination, not the tool. No LLM in the decision path."
# A short page with absolute links: the repository README uses relative
# images and links, which do not resolve on PyPI.
readme = "docs/pypi-core.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Bouncer contributors" }]
keywords = ["mcp", "model-context-protocol", "ai-agents", "agent-security", "prompt-injection", "tool-calls", "guardrails"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
benchmark = ["agentdojo>=0.1.35"]

[project.urls]
Homepage = "https://github.com/Ezed9/mcp-bouncer"
Repository = "https://github.com/Ezed9/mcp-bouncer"
Documentation = "https://github.com/Ezed9/mcp-bouncer/blob/main/docs/how-it-works.md"
Changelog = "https://github.com/Ezed9/mcp-bouncer/blob/main/CHANGELOG.md"
Issues = "https://github.com/Ezed9/mcp-bouncer/issues"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "types-jsonschema>=4.26.0.20261006",
    "types-pyyaml>=6.0.12.20260906",
]

# The MCP proxy is a separate distribution so that a consumer wanting only the
# engine does not pull `mcp`, and through it uvicorn, starlette, pydantic and
# pyjwt, for code it never calls. crawlgate was the first such consumer.
[tool.uv.workspace]
members = ["bouncer-mcp"]

[tool.pytest.ini_options]
pythonpath = ["src", "bouncer-mcp/src", "."]
testpaths = ["tests", "bouncer-mcp/tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "PIE"]
# UP042: Verdict/TrustLevel are deliberately (str, Enum), not StrEnum — the
# base class is load-bearing and we depend on .value serialization; not worth
# churning core security enums for a stylistic rule.
ignore = ["UP042"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bouncer"]

# The project root is the repository root, so without this the source
# archive takes in everything git does not ignore: benchmark traces, demo
# media, and any untracked folder on the machine that builds it.
[tool.hatch.build.targets.sdist]
include = ["/src", "/CHANGELOG.md"]
