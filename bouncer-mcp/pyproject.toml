[project]
name = "bouncer-mcp"
version = "0.1.4"
description = "A local stdio MCP proxy that enforces bouncer-core's contracts on every tool call"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "bouncer-core==0.1.4",
    "anyio>=4.0",
    # Built on the 2.x low-level Server (on_* handlers, snake_case fields).
    # 1.x is not supported: its decorator API is gone in 2.x. The suite passes
    # on 2.0.0 through 2.3.0.
    "mcp>=2,<3",
    # Imported directly for input validation; mcp 2.x already requires it.
    "jsonschema>=4.20",
]

[project.urls]
Homepage = "https://github.com/Ezed9/mcp-bouncer"
Issues = "https://github.com/Ezed9/mcp-bouncer/issues"

[project.scripts]
bouncer = "bouncer_mcp.cli:main"

# Resolves from the sibling directory in development; from PyPI once published.
[tool.uv.sources]
bouncer-core = { workspace = true }

[tool.pytest.ini_options]
pythonpath = ["src", "../src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bouncer_mcp"]
