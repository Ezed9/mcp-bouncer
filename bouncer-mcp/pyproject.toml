[project]
name = "bouncer-mcp"
version = "0.1.2"
description = "A local stdio MCP proxy that enforces bouncer-core's contracts on every tool call"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "bouncer-core==0.1.2",
    "anyio>=4.0",
    # mcp 2.0 (2026-07-28) removed the low-level Server decorators this proxy is
    # built on. Capped until the 2.x migration lands; 1.28 is the version CI
    # has always run.
    "mcp>=1.28,<2",
]

[project.urls]
Homepage = "https://github.com/Ezed9/mcp-bouncer"
Issues = "https://github.com/Ezed9/mcp-bouncer/issues"

[project.scripts]
bouncer = "bouncer_mcp.cli:main"

# Resolves from the sibling directory in development; from PyPI once published.
[tool.uv.sources]
bouncer-core = { workspace = true }

[tool.pytest.ini_options]
pythonpath = ["src", "../src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bouncer_mcp"]
