<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330" width="560" height="330" role="img" aria-label="AgentDojo attack success and benign task completion, with and without Bouncer" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<style>
.t1{fill:#656d76}.t2{fill:#7d8590}.grid{stroke:#7d8590;stroke-opacity:.35}
.whisk{stroke:#656d76}.atk{fill:#e5683a}.util{fill:#3b82f6}
</style>
<text x="16" y="26" class="t1" font-size="15" font-weight="600">AgentDojo workspace: attack success and benign task completion</text>
<text x="16" y="45" class="t2" font-size="11">Bars are rates; whiskers are 95% Clopper-Pearson intervals; labels are k/n.</text>
<rect x="16" y="58" width="10" height="10" rx="2" class="atk"/>
<text x="31" y="67" class="t1" font-size="11">Attack success (in-scope injections)</text>
<rect x="246" y="58" width="10" height="10" rx="2" class="util"/>
<text x="261" y="67" class="t1" font-size="11">Task completion, no attack</text>
<line x1="56" x2="540" y1="280.0" y2="280.0" class="grid" stroke-width="1"/>
<text x="50" y="284.0" class="t2" font-size="10" text-anchor="end">0%</text>
<line x1="56" x2="540" y1="231.5" y2="231.5" class="grid" stroke-width="1"/>
<text x="50" y="235.5" class="t2" font-size="10" text-anchor="end">25%</text>
<line x1="56" x2="540" y1="183.0" y2="183.0" class="grid" stroke-width="1"/>
<text x="50" y="187.0" class="t2" font-size="10" text-anchor="end">50%</text>
<line x1="56" x2="540" y1="134.5" y2="134.5" class="grid" stroke-width="1"/>
<text x="50" y="138.5" class="t2" font-size="10" text-anchor="end">75%</text>
<line x1="56" x2="540" y1="86.0" y2="86.0" class="grid" stroke-width="1"/>
<text x="50" y="90.0" class="t2" font-size="10" text-anchor="end">100%</text>
<text x="177.0" y="302" class="t1" font-size="12" font-weight="600" text-anchor="middle">No Bouncer</text>
<g>
<title>No Bouncer, Attack success: 48/164 = 29.3% (95% CI 22.4%–36.9%)</title>
<path class="atk" d="M112.0,280 V227.2 Q112.0,223.2 116.0,223.2 H172.0 Q176.0,223.2 176.0,227.2 V280 Z"/>
<line x1="144.0" x2="144.0" y1="236.5" y2="208.5" class="whisk" stroke-width="1.5"/>
<line x1="138.0" x2="150.0" y1="236.5" y2="236.5" class="whisk" stroke-width="1.5"/>
<line x1="138.0" x2="150.0" y1="208.5" y2="208.5" class="whisk" stroke-width="1.5"/>
<text x="144.0" y="200.5" class="t1" font-size="11" text-anchor="middle">48/164</text>
</g>
<g>
<title>No Bouncer, Task completion, no attack: 33/40 = 82.5% (95% CI 67.2%–92.7%)</title>
<path class="util" d="M178.0,280 V124.0 Q178.0,120.0 182.0,120.0 H238.0 Q242.0,120.0 242.0,124.0 V280 Z"/>
<line x1="210.0" x2="210.0" y1="149.6" y2="100.2" class="whisk" stroke-width="1.5"/>
<line x1="204.0" x2="216.0" y1="149.6" y2="149.6" class="whisk" stroke-width="1.5"/>
<line x1="204.0" x2="216.0" y1="100.2" y2="100.2" class="whisk" stroke-width="1.5"/>
<text x="210.0" y="92.2" class="t1" font-size="11" text-anchor="middle">33/40</text>
</g>
<text x="419.0" y="302" class="t1" font-size="12" font-weight="600" text-anchor="middle">With Bouncer</text>
<g>
<title>With Bouncer, Attack success: 0/163 = 0.0% (95% CI 0.0%–2.2%)</title>
<line x1="386.0" x2="386.0" y1="280.0" y2="275.7" class="whisk" stroke-width="1.5"/>
<line x1="380.0" x2="392.0" y1="280.0" y2="280.0" class="whisk" stroke-width="1.5"/>
<line x1="380.0" x2="392.0" y1="275.7" y2="275.7" class="whisk" stroke-width="1.5"/>
<text x="386.0" y="267.7" class="t1" font-size="11" text-anchor="middle">0/163</text>
</g>
<g>
<title>With Bouncer, Task completion, no attack: 30/40 = 75.0% (95% CI 58.8%–87.3%)</title>
<path class="util" d="M420.0,280 V138.5 Q420.0,134.5 424.0,134.5 H480.0 Q484.0,134.5 484.0,138.5 V280 Z"/>
<line x1="452.0" x2="452.0" y1="165.9" y2="110.6" class="whisk" stroke-width="1.5"/>
<line x1="446.0" x2="458.0" y1="165.9" y2="165.9" class="whisk" stroke-width="1.5"/>
<line x1="446.0" x2="458.0" y1="110.6" y2="110.6" class="whisk" stroke-width="1.5"/>
<text x="452.0" y="102.6" class="t1" font-size="11" text-anchor="middle">30/40</text>
</g>
</svg>
